name: Fetch Daily Target Data

on:
  schedule:
    # Run at 01:00 UTC every day
    - cron: '0 1 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      url_template:
        description: 'URL template for the target dataset (use {date} for today)'
        required: false
        default: 'https://raw.githubusercontent.com/OWNER/REPO/main/data/{date}/newTargets.geojson'

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        env:
          # Define this secret in the GitHub repository settings if the URL uses a private token, 
          # otherwise you can hardcode the template here or use the manual input.
          # Here we default to the workflow input, but you can replace this with your actual URL template
          TARGET_URL_TEMPLATE: ${{ inputs.url_template || 'https://raw.githubusercontent.com/OWNER/REPO/main/data/{date}/newTargets.geojson' }}
        run: |
          python backend/utils/fetch_daily_data.py --url "${TARGET_URL_TEMPLATE}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add backend/data/
          
          # Check if there are changes before committing
          if git diff-index --quiet HEAD --; then
            echo "No new targets data to commit."
          else
            git commit -m "chore: fetch daily target data for $(date +'%d-%m-%Y')"
            git push
          fi
