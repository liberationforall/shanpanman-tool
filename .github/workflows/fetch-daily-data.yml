name: Fetch Daily Target Data

on:
  schedule:
    # Run at 01:00 UTC every day
    - cron: '0 6 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      url_template_targets:
        description: 'URL template for the target dataset (use {date} for today)'
        required: false
        default: 'https://raw.githubusercontent.com/mahsanet/mahsa-alert-layers-main/{date}/newTargets.geojson'
      url_template_citizen:
        description: 'URL template for the citizen report dataset (use {date} for today)'
        required: false
        default: 'https://raw.githubusercontent.com/mahsanet/mahsa-alert-layers-main/{date}/citizenReport.geojson'

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic pydantic

      - name: Fetch newTargets data
        env:
          TARGET_URL: ${{ inputs.url_template_targets || 'https://raw.githubusercontent.com/mahsanet/mahsa-alert-layers-main/{date}/newTargets.geojson' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python backend/utils/fetch_daily_data.py --url "${TARGET_URL}" --file-type newTargets --api-key "${ANTHROPIC_API_KEY}"

      - name: Fetch citizenReport data
        env:
          CITIZEN_URL: ${{ inputs.url_template_citizen || 'https://raw.githubusercontent.com/mahsanet/mahsa-alert-layers-main/{date}/citizenReport.geojson' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python backend/utils/fetch_daily_data.py --url "${CITIZEN_URL}" --file-type citizenReport --api-key "${ANTHROPIC_API_KEY}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add backend/data/
          
          # Check if there are changes before committing
          if git diff-index --quiet HEAD --; then
            echo "No new targets data to commit."
          else
            git commit -m "chore: fetch daily target data for $(date +'%d-%m-%Y')"
            git push
          fi

